name: cascade
channels:
  - defaults
  - conda-forge
dependencies:
  # Core dependencies
  - python==3.11

  # Computational chemistry
  - packmol
  - postgresql

  # Pip packages for the Python modules
  - pip
  - pip:
      # General utilities
      - matplotlib
      - papermill
      - scikit-learn>=1
      - jupyterlab
      - parsl
      - pandas
      - sigfig
      - academy-py
      - SQLAlchemy
      - psycopg2
      - -e .[mace]
